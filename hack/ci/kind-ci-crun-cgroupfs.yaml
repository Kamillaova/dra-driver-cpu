# Same as kind-ci-crun-systemd.yaml, with the kubelet and every containerd
# runtime handler on the cgroupfs driver.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  DRANodeAllocatableResources: true # requires a 1.37+ node image
  DRAListTypeAttributes: true
  DRAFractionalCapacityRange: true # lets the scheduler book a fractional amount of a shared device
# kind applies only the patch whose version matches the node image's file.
containerdConfigPatches:
- |-
  version = 2
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
    SystemdCgroup = false
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.test-handler.options]
    SystemdCgroup = false
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.crun-writable]
    runtime_type = "io.containerd.runc.v2"
    base_runtime_spec = "/etc/containerd/cri-base.json"
    cgroup_writable = true
    pod_annotations = ["run.oci.systemd.subgroup", "run.oci.delegate-cgroup"]
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.crun-writable.options]
      BinaryName = "/usr/local/bin/crun"
      SystemdCgroup = false
- |-
  version = 3
  [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc.options]
    SystemdCgroup = false
  [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.test-handler.options]
    SystemdCgroup = false
  [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.crun-writable]
    runtime_type = "io.containerd.runc.v2"
    base_runtime_spec = "/etc/containerd/cri-base.json"
    cgroup_writable = true
    pod_annotations = ["run.oci.systemd.subgroup", "run.oci.delegate-cgroup"]
    [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.crun-writable.options]
      BinaryName = "/usr/local/bin/crun"
      SystemdCgroup = false
kubeadmConfigPatches:
- |
  kind: KubeletConfiguration
  cgroupDriver: cgroupfs
nodes:
# Node images are not pinned here: kind takes the image from the --image flag,
# which the Makefile sets to kindest/node:$(KIND_K8S_VERSION).
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    scheduler:
        extraArgs:
          v: "5"
          vmodule: "allocator=6,dynamicresources=6" # structured/allocator.go, DRA scheduler plugin
    controllerManager:
        extraArgs:
          v: "5"
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        v: "5"
- role: worker
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        v: "5"
- role: worker
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        v: "5"
