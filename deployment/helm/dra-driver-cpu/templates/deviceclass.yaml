{{- /* A class is rendered for every partition a claim can reach: the ones
       publishing exclusive devices and the pools. A reserved partition
       publishes no device, so a class for it would select nothing. Classes are
       cluster-scoped while partitions are per node type, so the names of every
       profile's partitions are gathered together and a name two node types
       share yields one class. */ -}}
{{- $cfg := (include "dra-driver-cpu.effectiveDriverConfig" . | fromYaml) }}
{{- $declared := $cfg.cpuPartitions | default list }}
{{- range $_, $profile := ($cfg.profiles | default dict) }}
{{- $declared = concat $declared ($profile.cpuPartitions | default list) }}
{{- end }}
{{- $reachable := dict }}
{{- range $partition := $declared }}
{{- if ne $partition.role "reserved" }}
{{- $_ := set $reachable $partition.name true }}
{{- end }}
{{- end }}
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: dra.cpu
spec:
  selectors:
    - cel:
        expression: device.driver == "dra.cpu" && device.attributes["dra.cpu"].partition == "default"
{{- range $name, $_ := $reachable }}
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: dra.cpu-{{ $name }}
spec:
  selectors:
    - cel:
        expression: device.driver == "dra.cpu" && device.attributes["dra.cpu"].partition == "{{ $name }}"
{{- end }}
