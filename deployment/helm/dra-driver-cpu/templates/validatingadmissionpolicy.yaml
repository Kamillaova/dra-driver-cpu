{{- if .Values.rbac.create }}
---
# The driver's service account writes events from every node, and RBAC cannot
# tell one node's events from another's. A core v1 update leaves an event's
# source open to change, so an update is judged by its old source too.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "dra-driver-cpu.fullname" . }}-events
  labels:
    {{- include "dra-driver-cpu.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["events"]
  matchConditions:
    - name: driver-service-account
      expression: >-
        request.userInfo.username == "system:serviceaccount:{{ .Release.Namespace }}:{{ include "dra-driver-cpu.fullname" . }}"
  variables:
    - name: nodeName
      expression: >-
        request.userInfo.?extra[?'authentication.kubernetes.io/node-name'][0].orValue('')
    - name: sourceHost
      expression: >-
        object.?source.?host.orValue('')
    - name: oldSourceHost
      expression: >-
        oldObject.?source.?host.orValue('')
  validations:
    - expression: variables.nodeName != ''
      message: >-
        the driver's service account token names no node: run the driver in a pod, with the
        token the kubelet mounts into it
    - expression: variables.sourceHost == variables.nodeName
      messageExpression: >-
        "the driver on node '" + variables.nodeName + "' may write only events whose source
        host is its node, not '" + variables.sourceHost + "'"
    - expression: >-
        request.operation != 'UPDATE' || variables.oldSourceHost == variables.nodeName
      messageExpression: >-
        "the driver on node '" + variables.nodeName + "' may update only events whose source
        host is its node, not '" + variables.oldSourceHost + "'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "dra-driver-cpu.fullname" . }}-events
  labels:
    {{- include "dra-driver-cpu.labels" . | nindent 4 }}
spec:
  policyName: {{ include "dra-driver-cpu.fullname" . }}-events
  validationActions: [Deny]
{{- end }}
