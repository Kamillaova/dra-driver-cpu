{{- $driverConfig := include "dra-driver-cpu.effectiveDriverConfig" . | fromYaml }}
{{- if .Values.rbac.create }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "dra-driver-cpu.fullname" . }}
  labels:
    {{- include "dra-driver-cpu.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      {{- /* The fit annotation goes on the driver's own Node, and removing a
             stale one needs the same verb. Granted only while it is being
             published: otherwise every cluster running this driver hands a
             node agent write access to every Node object for a feature it is
             not using. */ -}}
      {{- if ($driverConfig).publishFitAnnotation }}
      - patch
      {{- end }}
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceslices
    verbs:
      - list
      - watch
      - create
      - update
      - delete
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceclaims
      - deviceclasses
    verbs:
      - get
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceclaims/status
    verbs:
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "resource.k8s.io"
    resources:
      - resourceclaims/driver
    resourceNames:
      - dra.cpu
    verbs:
      - associated-node:patch
      - associated-node:update
{{- end }}
