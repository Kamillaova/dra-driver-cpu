include:
  - project: cloud/ci/templates
    ref: kamillaova/universal-templates
    file:
      - Docker.gitlab-ci.yml
      - Helm.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

variables:
  PUBLISH_ALL_BRANCHES: "true"
  CHART_DIR: deployment/helm/dra-driver-cpu

lint:
  # The included templates own the stage list; .pre exists whatever they set.
  stage: .pre
  image: golang:1.26
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-mod
      - .cache/golangci-lint
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.cache/golangci-lint
  script:
    - make install-golangci-lint
    - make lint
