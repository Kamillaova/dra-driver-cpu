name: e2e lanes

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'deployment/helm/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'test/**'
      - 'hack/ci/kind-ci.yaml'
      - 'hack/ci/kind-ci-*.yaml'
      - 'hack/ci/lane-setup.sh'
      - 'hack/ci/wait-resourcelices.sh'
      - 'Makefile'
      - '.github/workflows/e2e-lanes.yaml'

jobs:
  e2e-lane:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two cores of two threads: no core without an online sibling, so
          # no nosmt partition.
          - lane: partitions
            runner: ubuntu-26.04
            labels: partitions
            mustRun: |
              should publish on each node the partitions of its own profile
              should publish the default partition's devices with a shared request policy, and map only them
              should cap a share at its amount and give the amount in its metadata file
              should run a share that books no amount uncapped
              should refuse a container holding a second capped share
              should leave a share no shared device can hold Pending
              should route a share only the largest shared device can hold to its node
              should book no more of a node's shared devices than they hold under a burst of racing shares
              should publish devices and report the reservation on a node whose kubelet reserves its partitions' CPUs
              should publish nothing and report the missing reservation on a node whose kubelet reserves too little
          # Four cores of one thread.
          - lane: partitions
            runner: ubuntu-26.04-arm
            labels: partitions
            mustRun: |
              should publish on each node the partitions of its own profile
              should publish devices of one thread per core for the partition
              should give a claim on the partition's class CPUs of the partition without an online sibling
              should keep a container without a claim off the partition
              should give a claim on dra.cpu a share of the default partition
              should publish the default partition's devices with a shared request policy, and map only them
              should cap a share at its amount and give the amount in its metadata file
              should run a share that books no amount uncapped
              should refuse a container holding a second capped share
              should leave a share no shared device can hold Pending
              should route a share only the largest shared device can hold to its node
              should book no more of a node's shared devices than they hold under a burst of racing shares
              should publish devices and report the reservation on a node whose kubelet reserves its partitions' CPUs
              should publish nothing and report the missing reservation on a node whose kubelet reserves too little
    name: e2e (${{ matrix.lane }}, ${{ matrix.runner }})
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.4

      - name: Run the lane
        run: |
          make test-e2e-kind \
            DRACPU_E2E_LANE=${{ matrix.lane }} \
            DRACPU_E2E_LABEL_FILTER='${{ matrix.labels }}' \
            DRACPU_E2E_REPORT="${RUNNER_TEMP}/ginkgo-report.json"

      # A spec skips where its host lacks what it needs, so a lane whose host
      # was meant to have it must not pass on a skip.
      - name: Check the specs the runner must run
        env:
          MUST_RUN: ${{ matrix.mustRun }}
        run: |
          failed=0
          while IFS= read -r spec; do
            [ -n "${spec}" ] || continue
            state=$(jq -r --arg spec "${spec}" \
              '[.[].SpecReports[]? | select(.LeafNodeText == $spec) | .State] | first // "missing"' \
              "${RUNNER_TEMP}/ginkgo-report.json")
            if [ "${state}" != passed ]; then
              echo "::error::spec \"${spec}\" is ${state}, not passed"
              failed=1
            fi
          done <<<"${MUST_RUN}"
          exit "${failed}"

      - name: Final check
        if: failure()
        continue-on-error: true
        run: |
          kubectl get nodes --show-labels || true
          kubectl get pods -A -o wide || true
          kubectl logs -n kube-system -l app=dracpu --tail=200 || true
          kubectl get resourceslice -o yaml || true

      - name: Delete kind cluster
        if: always()
        run: make delete-kind-cluster
